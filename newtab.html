<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Somenow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 배경 사진. 로드가 확인된 뒤에만 .is-ready 가 붙어 화면에 나타난다. -->
  <!-- 사진은 두 장을 겹쳐 쓴다. 새 사진을 위에 띄우고 서서히 나타나게 해야 끊기지 않는다. -->
  <div id="photo" class="photo" aria-hidden="true"></div>
  <div id="photoB" class="photo" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>

  <!-- 우측 상단: Gmail · 이미지 · 앱 런처 (구글 홈과 같은 배치) -->
  <nav class="topbar">
    <a class="tlink" href="https://mail.google.com/">Gmail</a>
    <a class="tlink" href="https://images.google.com/">이미지</a>
    <button id="appsBtn" class="apps-btn" aria-label="Google 앱" title="Google 앱">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor">
        <circle cx="4" cy="4" r="2"/><circle cx="12" cy="4" r="2"/><circle cx="20" cy="4" r="2"/>
        <circle cx="4" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="20" cy="12" r="2"/>
        <circle cx="4" cy="20" r="2"/><circle cx="12" cy="20" r="2"/><circle cx="20" cy="20" r="2"/>
      </g></svg>
    </button>
    <!-- 구글 런처와 같은 구성·순서(2026-08 원본 캡처 기준). 아이콘은 크롬 파비콘 API 를 쓴다 -->
    <div id="appsPanel" class="apps-panel" hidden>
      <a href="https://myaccount.google.com/"><img class="app-ic" src="/_favicon/?pageUrl=https://myaccount.google.com/&amp;size=64" alt="">계정</a>
      <a href="https://www.google.com/"><img class="app-ic" src="/_favicon/?pageUrl=https://www.google.com/&amp;size=64" alt="">검색</a>
      <a href="https://maps.google.com/"><img class="app-ic" src="/_favicon/?pageUrl=https://maps.google.com/&amp;size=64" alt="">지도</a>
      <a href="https://www.youtube.com/"><img class="app-ic" src="/_favicon/?pageUrl=https://www.youtube.com/&amp;size=64" alt="">YouTube</a>
      <a href="https://docs.google.com/forms/"><img class="app-ic" src="/_favicon/?pageUrl=https://docs.google.com/forms/&amp;size=64" alt="">Forms</a>
      <a href="https://docs.google.com/spreadsheets/"><img class="app-ic" src="/_favicon/?pageUrl=https://docs.google.com/spreadsheets/&amp;size=64" alt="">Sheets</a>
      <a href="https://play.google.com/"><img class="app-ic" src="/_favicon/?pageUrl=https://play.google.com/&amp;size=64" alt="">Play</a>
      <a href="https://mail.google.com/"><img class="app-ic" src="/_favicon/?pageUrl=https://mail.google.com/&amp;size=64" alt="">Gmail</a>
      <a href="https://drive.google.com/"><img class="app-ic" src="/_favicon/?pageUrl=https://drive.google.com/&amp;size=64" alt="">드라이브</a>
      <a href="https://gemini.google.com/"><img class="app-ic" src="/_favicon/?pageUrl=https://gemini.google.com/&amp;size=64" alt="">Gemini</a>
      <a href="https://calendar.google.com/"><img class="app-ic" src="/_favicon/?pageUrl=https://calendar.google.com/&amp;size=64" alt="">Calendar</a>
      <a href="https://news.google.com/"><img class="app-ic" src="/_favicon/?pageUrl=https://news.google.com/&amp;size=64" alt="">뉴스</a>
      <a href="https://photos.google.com/"><img class="app-ic" src="/_favicon/?pageUrl=https://photos.google.com/&amp;size=64" alt="">포토</a>
      <a href="https://meet.google.com/"><img class="app-ic" src="/_favicon/?pageUrl=https://meet.google.com/&amp;size=64" alt="">Meet</a>
      <a href="https://translate.google.com/"><img class="app-ic" src="/_favicon/?pageUrl=https://translate.google.com/&amp;size=64" alt="">번역</a>
    </div>
  </nav>

  <main class="stage">
    <header class="place">
      <p id="cityEn" class="city-en" aria-hidden="true">SOMENOW</p>
      <h1 id="city" class="city">Somenow</h1>
      <p id="tagline" class="tagline">언젠가 가야지, 하던 곳</p>
      <p id="cityMeta" class="meta" hidden></p>
    </header>

    <div class="action">
      <a id="flightBtn" class="flight-btn" href="#" target="_blank" rel="noopener noreferrer">항공권 보기</a>
      <button id="wishBtn" class="shuffle-btn wish-btn" title="위시리스트에 담기" aria-label="위시리스트에 담기" aria-pressed="false" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-6.7-4.35-9.33-8.06C.6 10.1 1.6 6.4 4.6 5.2c1.9-.76 4.1-.1 5.4 1.5L12 8.7l2-2c1.3-1.6 3.5-2.26 5.4-1.5 3 1.2 4 4.9 1.93 7.74C18.7 16.65 12 21 12 21z"/></svg>
      </button>
      <button id="cardBtn" class="shuffle-btn" title="도시 정보" aria-label="도시 정보" aria-expanded="false" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 4.5a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6zM13.3 17h-2.6v-6.4h2.6V17z"/></svg>
      </button>
      <button id="shuffleBtn" class="shuffle-btn" title="다른 도시 보기" aria-label="다른 도시 보기">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
  </main>

  <!-- 가운데: 시계 · 검색창 · 바로가기 -->
  <section class="hub">
    <div class="clock" aria-hidden="true">
      <div id="clockTime" class="clock-time"></div>
      <div id="clockDate" class="clock-date"></div>
    </div>

    <form id="searchForm" class="search" autocomplete="off">
      <span class="sicon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#5f6368" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      </span>
      <input id="searchInput" type="text" placeholder="Google 검색" aria-label="Google 검색">
      <a id="lensBtn" class="lens-btn" href="https://lens.google.com/" title="구글 렌즈로 이미지 검색">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#5f6368" d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm8-3h-2.6l-1.7-2H8.3L6.6 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm-8 11a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
      </a>
      <a id="aiBtn" class="ai-chip" href="https://www.google.com/search?udm=50" title="Google AI 모드">AI 모드</a>
    </form>

    <div id="topSites" class="topsites"></div>

    <div id="addPop" class="add-pop" hidden>
      <input id="addName" type="text" placeholder="이름" maxlength="30">
      <input id="addUrl" type="text" placeholder="URL (예: naver.com)" maxlength="200">
      <div class="add-actions">
        <button type="button" id="addCancel" class="add-btn">취소</button>
        <button type="button" id="addSave" class="add-btn add-primary">추가</button>
      </div>
    </div>

  </section>

  <!-- 도시 카드: 더 보기를 눌렀을 때만 올라온다 -->
  <section id="cityCard" class="city-card" hidden aria-label="도시 정보">
    <div class="card-head">
      <div>
        <div id="cardCity" class="card-city"></div>
        <div id="cardDday" class="card-dday" hidden></div>
      </div>
      <div id="cardWeather" class="card-weather">—</div>
    </div>
    <div class="card-grid">
      <div class="card-block">
        <div class="card-label">여행 적기</div>
        <div id="cardBest" class="card-text"></div>
      </div>
      <div class="card-block">
        <div class="card-label">가볼 곳</div>
        <div id="cardSights" class="card-text"></div>
      </div>
      <div class="card-block">
        <div class="card-label">먹을 것</div>
        <div id="cardFoods" class="card-text"></div>
      </div>
      <div class="card-block card-wide">
        <div class="card-label">알아두기</div>
        <div id="cardFacts" class="card-facts"></div>
      </div>
      <div class="card-block card-wide card-stay" id="cardStayBlock" hidden>
        <div class="card-label">어디에 묵을까</div>
        <div id="cardAreas" class="card-areas"></div>
      </div>
    </div>
    <div class="card-foot">날씨 Open-Meteo · 사진 Unsplash · 숙소와 항공권은 제휴 링크입니다</div>
  </section>

  <!-- 좌측 하단: 위시리스트 목록 -->
  <button id="wishListBtn" class="set-btn wish-list-btn" title="위시리스트" aria-label="위시리스트" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-6.7-4.35-9.33-8.06C.6 10.1 1.6 6.4 4.6 5.2c1.9-.76 4.1-.1 5.4 1.5L12 8.7l2-2c1.3-1.6 3.5-2.26 5.4-1.5 3 1.2 4 4.9 1.93 7.74C18.7 16.65 12 21 12 21z"/></svg>
    <span id="wishCount" class="wish-count" hidden>0</span>
  </button>
  <div id="wishPanel" class="set-panel wish-panel" hidden>
    <div class="set-title">위시리스트</div>
    <div id="wishRows" class="wish-rows"></div>
  </div>

  <!-- 좌측 하단: 설정 -->
  <button id="setBtn" class="set-btn" title="화면 설정" aria-label="화면 설정">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M19.14 12.94a7.5 7.5 0 0 0 .05-.94 7.5 7.5 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.63l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.8a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.85a.5.5 0 0 0 .12.63l2.03 1.58a7.5 7.5 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.63l1.92 3.32c.13.22.39.31.6.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.8c.25 0 .46-.18.5-.42l.36-2.54a7.3 7.3 0 0 0 1.62-.94l2.39.96c.21.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.63l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
  </button>
  <div id="setPanel" class="set-panel" hidden>
    <div class="set-title">화면 설정</div>
    <label class="set-row"><input type="checkbox" id="optClock"> 시계 표시</label>
    <label class="set-row"><input type="checkbox" id="optSearch"> 검색창 표시</label>
    <label class="set-row"><input type="checkbox" id="optSites"> 바로가기 표시</label>
    <div class="set-sep"></div>
    <label class="set-row set-row-col" for="optOrigin">
      <span class="set-label">출발 도시</span>
      <select id="optOrigin" class="set-select"></select>
    </label>
  </div>

  <!-- Unsplash 표기 요건: 사진작가 이름 + Unsplash 링크 -->
  <footer id="credit" class="credit" hidden>
    Photo by <a id="creditAuthor" href="#" target="_blank" rel="noopener noreferrer"></a>
    on <a id="creditUnsplash" href="#" target="_blank" rel="noopener noreferrer">Unsplash</a>
  </footer>

  <!-- config.js 는 저장소에 없을 수 있다(.gitignore). 없으면 404 로그만 남고 동작은 계속된다. -->
  <script src="config.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
