<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Somenow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 배경 사진. 로드가 확인된 뒤에만 .is-ready 가 붙어 화면에 나타난다. -->
  <div id="photo" class="photo" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>

  <!-- 우측 상단: Gmail · 이미지 · 앱 런처 (구글 홈과 같은 배치) -->
  <nav class="topbar">
    <a class="tlink" href="https://mail.google.com/">Gmail</a>
    <a class="tlink" href="https://images.google.com/">이미지</a>
    <button id="appsBtn" class="apps-btn" aria-label="Google 앱" title="Google 앱">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor">
        <circle cx="4" cy="4" r="2"/><circle cx="12" cy="4" r="2"/><circle cx="20" cy="4" r="2"/>
        <circle cx="4" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="20" cy="12" r="2"/>
        <circle cx="4" cy="20" r="2"/><circle cx="12" cy="20" r="2"/><circle cx="20" cy="20" r="2"/>
      </g></svg>
    </button>
    <div id="appsPanel" class="apps-panel" hidden>
      <a href="https://mail.google.com/"><span class="app-ic" style="background:#ea4335">M</span>Gmail</a>
      <a href="https://www.youtube.com/"><span class="app-ic" style="background:#ff0033">Y</span>YouTube</a>
      <a href="https://drive.google.com/"><span class="app-ic" style="background:#34a853">D</span>드라이브</a>
      <a href="https://maps.google.com/"><span class="app-ic" style="background:#4285f4">M</span>지도</a>
      <a href="https://calendar.google.com/"><span class="app-ic" style="background:#1a73e8">C</span>캘린더</a>
      <a href="https://photos.google.com/"><span class="app-ic" style="background:#fbbc04;color:#3c4043">P</span>포토</a>
      <a href="https://translate.google.com/"><span class="app-ic" style="background:#4285f4">T</span>번역</a>
      <a href="https://news.google.com/"><span class="app-ic" style="background:#5f6368">N</span>뉴스</a>
      <a href="https://docs.google.com/"><span class="app-ic" style="background:#4285f4">D</span>문서</a>
    </div>
  </nav>

  <main class="stage">
    <header class="place">
      <h1 id="city" class="city">Somenow</h1>
      <p id="tagline" class="tagline">언젠가 가야지, 하던 곳</p>
    </header>

    <div class="action">
      <a id="flightBtn" class="flight-btn" href="#" target="_blank" rel="noopener noreferrer">항공권 보기</a>
    </div>
  </main>

  <!-- 가운데: 시계 · 검색창 · 바로가기 -->
  <section class="hub">
    <div class="clock" aria-hidden="true">
      <div id="clockTime" class="clock-time"></div>
      <div id="clockDate" class="clock-date"></div>
    </div>

    <form id="searchForm" class="search" autocomplete="off">
      <span class="sicon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#5f6368" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      </span>
      <input id="searchInput" type="text" placeholder="Google 검색" aria-label="Google 검색">
      <a id="lensBtn" class="lens-btn" href="https://lens.google.com/" title="구글 렌즈로 이미지 검색">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#5f6368" d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm8-3h-2.6l-1.7-2H8.3L6.6 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm-8 11a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
      </a>
      <a id="aiBtn" class="ai-chip" href="https://www.google.com/search?udm=50" title="Google AI 모드">AI 모드</a>
    </form>

    <div id="topSites" class="topsites"></div>

  </section>

  <!-- Unsplash 표기 요건: 사진작가 이름 + Unsplash 링크 -->
  <footer id="credit" class="credit" hidden>
    Photo by <a id="creditAuthor" href="#" target="_blank" rel="noopener noreferrer"></a>
    on <a id="creditUnsplash" href="#" target="_blank" rel="noopener noreferrer">Unsplash</a>
  </footer>

  <!-- config.js 는 저장소에 없을 수 있다(.gitignore). 없으면 404 로그만 남고 동작은 계속된다. -->
  <script src="config.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
